name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-validate:
    name: composer.json validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

  php-syntax:
    name: PHP syntax check (php -l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint every .php file
        run: |
          set -euo pipefail
          find app bootstrap config database routes tests -type f -name "*.php" -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/lint.out 2>&1 || (cat /tmp/lint.out && exit 1)
          echo "All PHP files passed syntax check."

  node-build:
    name: Front-end build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm deps
        run: npm ci || npm install

      - name: Build assets
        run: npm run build


  security-audit:
    name: Security audit (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install Composer deps
        uses: ramsey/composer-install@v3

      - name: Run composer audit
        run: composer audit

  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install Composer deps
        uses: ramsey/composer-install@v3

      - name: Run Pint in test mode
        run: ./vendor/bin/pint --test

  phpunit:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    # Test suite uses in-memory SQLite (see phpunit.xml) so no DB service
    # is needed. APP_KEY / DB_CONNECTION etc. are baked into phpunit.xml.
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          extensions: bcmath,ctype,curl,dom,fileinfo,intl,mbstring,openssl,pdo_sqlite,tokenizer,xml,zip,gd

      - name: Install Composer deps
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: php artisan test
